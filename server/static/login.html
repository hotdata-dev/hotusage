<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hotusage - sign in</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brandrow nosub">
        <img class="mark" src="/static/icon.svg" width="22" height="22" alt="">
        <h1>hotusage</h1>
      </div>
      <div class="err" id="err">Wrong email or password.</div>
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{NEXT}}">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="signin" type="submit">Sign in</button>
      </form>
      <div class="alt">New here? <a href="/register">Create an organization</a></div>
    </div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('err')) {
      document.getElementById('err').classList.add('show');
    }
  </script>
</body>
</html>
