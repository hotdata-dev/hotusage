<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>hototel</title>
  <!-- The header mark as a favicon: nine cells warming toward the corner.
       Colours are literal because CSS variables cannot resolve inside an icon.
       The neutral grey is the value of the muted token, the one token whose
       value is identical in both themes, so this reads on a light or a dark
       tab bar alike. (No double hyphens here: XML comments forbid them.) -->
  <rect x="3"  y="3"  width="8" height="8" rx="2.5" fill="#898781" opacity=".45"/>
  <rect x="12" y="3"  width="8" height="8" rx="2.5" fill="#898781" opacity=".7"/>
  <rect x="21" y="3"  width="8" height="8" rx="2.5" fill="#2a78d6" opacity=".7"/>
  <rect x="3"  y="12" width="8" height="8" rx="2.5" fill="#898781" opacity=".7"/>
  <rect x="12" y="12" width="8" height="8" rx="2.5" fill="#1baf7a"/>
  <rect x="21" y="12" width="8" height="8" rx="2.5" fill="#eda100"/>
  <rect x="3"  y="21" width="8" height="8" rx="2.5" fill="#2a78d6" opacity=".7"/>
  <rect x="12" y="21" width="8" height="8" rx="2.5" fill="#eda100"/>
  <rect x="21" y="21" width="8" height="8" rx="2.5" fill="#eb6834"/>
</svg>
