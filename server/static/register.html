<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hotusage - create an organization</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>hotusage</h1>
      <div class="sub">Create your organization</div>
      <div class="err" id="err">{{ERROR}}</div>
      <form method="post" action="/register">
        <div class="field">
          <label for="org_name">Organization name</label>
          <input id="org_name" name="org_name" type="text" minlength="2" maxlength="60"
                 placeholder="Acme Inc" required autofocus>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" minlength="8"
                 autocomplete="new-password" required>
        </div>
        <button class="signin" type="submit">Create organization</button>
      </form>
      <div class="alt">Already have an account? <a href="/login">Sign in</a></div>
    </div>
  </div>
  <script>
    var err = document.getElementById('err');
    if (err.textContent.trim()) err.classList.add('show');
  </script>
</body>
</html>
